version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        user: laravel
        uid: 1000
    image: tera-app-prod
    container_name: tera_app_prod
    restart: unless-stopped
    working_dir: /var/www
    environment:
      - TZ=America/Mexico_City
    volumes:
      - ./:/var/www
      - ./php-local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - tera-network-prod

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        user: laravel
        uid: 1000
    image: tera-app-prod
    container_name: tera_scheduler_prod
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    environment:
      - TZ=America/Mexico_City
    volumes:
      - ./:/var/www
      - ./php-local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - tera-network-prod
    depends_on:
      - app
      - db

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        user: laravel
        uid: 1000
    image: tera-app-prod
    container_name: tera_queue_prod
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --queue=default --tries=1 --timeout=300
    environment:
      - TZ=America/Mexico_City
    volumes:
      - ./:/var/www
      - ./php-local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - tera-network-prod
    depends_on:
      - app
      - db

  web:
    image: nginx:alpine
    container_name: tera_web_prod
    restart: unless-stopped
    environment:
      - TZ=America/Mexico_City
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - tera-network-prod

  db:
    image: mysql:8.0
    container_name: tera_db_prod
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      TZ: America/Mexico_City
    volumes:
      - dbdata_prod:/var/lib/mysql
    networks:
      - tera-network-prod
    command: --default-authentication-plugin=mysql_native_password

  cloudflared:
     image: cloudflare/cloudflared:latest
     container_name: tera_tunnel_prod
     restart: unless-stopped
     command: tunnel --no-autoupdate run --token apideeejmploparamayorseguridad
     networks:
       - tera-network-prod
     depends_on:
       - web

networks:
  tera-network-prod:
    driver: bridge

volumes:
  dbdata_prod: